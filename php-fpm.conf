[global]
pid = /tmp/php-fpm.pid
error_log = /dev/stderr
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0666
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
